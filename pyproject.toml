[project]
name = "mqtt-to-sqlite-collector"
version = "0.1.0"
description = "MQTT telemetry collector: pydantic validation, SQLite with WAL, retention roll-up, FastAPI read API"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:amqtt", "ignore::DeprecationWarning:pkg_resources"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
