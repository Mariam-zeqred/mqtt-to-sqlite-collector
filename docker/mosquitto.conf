# Mosquitto 2.x for the collector stack.
# 1883 inside the compose network and on the LAN, username/password required (docker/passwd).
#   docker run --rm -it -v "$PWD/docker:/w" eclipse-mosquitto:2 mosquitto_passwd -c -b /w/passwd collector <password>
#   (add the node's user the same way without -c)
# For the TLS listener the ESP32 node expects, copy the esp32-mqtt-sensor-node repo's certs/ here and
# uncomment the 8883 block.
listener 1883
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd

#listener 8883
#cafile /mosquitto/certs/ca.crt
#certfile /mosquitto/certs/server.crt
#keyfile /mosquitto/certs/server.key
#tls_version tlsv1.2

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
